<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/ScrollMagic.min.js" integrity="sha512-8E3KZoPoZCD+1dgfqhPbejQBnQfBXe8FuwL4z/c8sTrgeDMFEnoyTlH3obB4/fV+6Sg0a0XF+L/6xS4Xx1fUEg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body {
            margin: 0;
        }
        .section {
            width: 100%;
        }
        .container {
            position: relative;
            width: 1200px;
            height: 600px;
            padding: 20px;
            margin: auto;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .section:nth-child(even) {
            background-color: lightgray;
        }
        h1 {
            position: absolute;
            top: 0;
            color: white;
            font-size: 100px;
            margin: 0;
        }
        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: lightyellow;
        }
        .back-to-position {
            transition: 1s;
            opacity: 0;
        }

        .back-to-position.to-right {
            transform: translateX(-150px);
        }
        .back-to-position.to-left {
            transform: translateX(150px);
        }

        .show .back-to-position {
            opacity: 1;
            transform: translateX(0);
        }
        .show .back-to-position.to-left {
            transition-delay: 0;
        }
        .show .back-to-position.to-right {
            transition-delay: .3s;
        }

    </style>
</head>
<body>
    <section class="section scroll-spy">
        <div class="container">
            <h1>Home</h1>
            <div class="box back-to-position to-right delay-0"></div>
            <div class="box back-to-position to-left delay-1"></div>
        </div>
    </section>
    <section class="section scroll-spy">
        <div class="container">
            <h1>About</h1>
            <div class="box back-to-position to-right delay-0"></div>
            <div class="box back-to-position to-left delay-1"></div>
        </div>
    </section>
    <section class="section scroll-spy">
        <div class="container">
            <h1>Skills</h1>
            <div class="box back-to-position to-right delay-0"></div>
            <div class="box back-to-position to-left delay-1"></div>
        </div>
    </section>
    <section class="section scroll-spy">
        <div class="container">
            <h1>Works</h1>
            <div class="box back-to-position to-right delay-0"></div>
            <div class="box back-to-position to-left delay-1"></div>
        </div>
    </section>
    <section class="section scroll-spy smagic">
        <div class="container">
            <h1>Contact</h1>
            <div class="box back-to-position to-right delay-0"></div>
            <div class="box back-to-position to-left delay-1"></div>
        </div>
    </section>

    <script>

        const triggerEls = document.querySelectorAll('section.scroll-spy');

        const controller = new ScrollMagic.Controller();
        triggerEls.forEach(function(triggerEl){
            new ScrollMagic.Scene({
            triggerElement: triggerEl,
            })
            .setClassToggle(triggerEl, 'show')
            .addTo(controller);
        })

        

    </script>
    
</body>
</html>
